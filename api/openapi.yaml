openapi: 3.1.0
info:
  title: RateGuard
  version: 0.1.0
  summary: Distributed API rate limiting as a service.
  description: |
    RateGuard decides whether a request to your application should be allowed,
    against a token bucket shared by every RateGuard instance through Redis.

    Every response carries an `X-Request-ID` header. An inbound `X-Request-ID`
    of at most 64 characters from `[A-Za-z0-9._-]` is reused; anything else is
    replaced with a generated ID.

    Admin routes (`/v1/clients`, `/v1/policies`) require
    `Authorization: Bearer <RG_ADMIN_TOKEN>`.
    Every error has the same body: `{"error": "...", "request_id": "..."}`.
servers:
  - url: http://127.0.0.1:8080
    description: Local Docker Compose stack
security:
  - adminToken: []
tags:
  - name: decisions
    description: |
      The hot path: whether a request may proceed. Decisions read no
      database and are shared by every RateGuard instance through Redis.
  - name: health
    description: Liveness and readiness probes, and the Prometheus scrape.
  - name: clients
    description: Register client applications and manage their API keys.
  - name: policies
    description: |
      Rate-limit policies such as Free, Premium and Enterprise. A caller with
      an API key uses its client's policy; anyone else, and a client whose
      policy is disabled or unassigned, uses the default policy. With neither,
      the caller has no policy and is refused, never allowed unlimited
      (ADR 0009). Changes reach every RateGuard instance within milliseconds.
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Liveness probe
      description: Reports that the process is up. It checks no dependencies.
      security: [] # Probes are unauthenticated by design.
      responses:
        "200":
          description: The process is serving.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: Readiness probe
      description: |
        Checks that PostgreSQL and Redis answer within `RG_READINESS_TIMEOUT`.
        The checks run concurrently. Failure details go to the service log,
        never into the response.
      security: [] # Probes are unauthenticated by design.
      responses:
        "200":
          description: Every dependency is reachable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ready
                checks: {postgres: ok, redis: ok}
        "503":
          description: At least one dependency is unreachable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: not ready
                checks: {postgres: unavailable, redis: ok}
  /metrics:
    get:
      tags: [health]
      operationId: getMetrics
      summary: Prometheus scrape
      description: |
        Metrics in the Prometheus text format. Among them,
        `rateguard_degraded_decisions_total` counts decisions made without
        Redis, `rateguard_redis_errors_total` counts failed Redis calls, and
        `rateguard_redis_breaker_state` is 0, 1 or 2 for a closed, half-open
        or open circuit breaker (ADR 0014). No label names a client or a key.
      security: [] # Scraped like the probes; it carries only aggregates.
      responses:
        "200":
          description: The current metrics.
          content:
            text/plain:
              schema:
                type: string
              example: |
                # TYPE rateguard_degraded_decisions_total counter
                rateguard_degraded_decisions_total{mode="local"} 0
  /openapi.yaml:
    get:
      tags: [health]
      operationId: getOpenAPI
      summary: This document
      description: The OpenAPI document the running binary was built with.
      security: []
      responses:
        "200":
          description: The contract.
          content:
            application/yaml:
              schema:
                type: string
  /v1/check:
    post:
      tags: [decisions]
      operationId: check
      summary: Decide a request and consume a token
      description: |
        Asks whether a request your application received may proceed, and
        takes a token from the caller's bucket if it may (ADR 0015). Forward
        the caller's `Authorization: Bearer <API key>` header if it sent one.
        Without one, the caller is identified by IP: the connection's address,
        or `X-Forwarded-For` as appended by a network in `RG_TRUSTED_PROXIES`.

        The answer is the status: 200 to serve the request, 429 to refuse it.
        Durations are whole seconds, rounded up. While Redis is unreachable
        the decision is made locally (ADR 0014) and the response looks the
        same.
      security:
        - {}
        - callerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CheckRequest"}
            example: {method: GET, path: /api/products}
      responses:
        "200":
          description: Allowed. A token was taken.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Decision"}
              example: {allowed: true, limit: 100, remaining: 72, reset_after: 18}
        "429":
          description: Refused. The bucket is empty; retry after `retry_after` seconds.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Retry-After:
              description: Seconds until a request would be allowed, rounded up; equal to `retry_after`.
              schema: {type: integer, minimum: 1}
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Decision"}
              example: {allowed: false, limit: 100, remaining: 0, reset_after: 12, retry_after: 12}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidAPIKey"
        "403":
          description: The caller's client is disabled, or no enabled policy applies to the caller (ADR 0009).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
              example: {error: no rate-limit policy applies to this caller, request_id: 3f1c2a9e0b7d4c6e8a5f1b2c3d4e5f60}
        "413":
          description: The body is larger than 4 KiB.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/peek:
    post:
      tags: [decisions]
      operationId: peek
      summary: Report the allowance without consuming a token
      description: |
        Takes the same body and identifies the caller the same way as
        `/v1/check`, but takes no token and never creates a bucket
        (ADR 0016). It answers 200 whatever the outcome: `allowed` says
        whether a check now would be allowed, `remaining` counts the tokens
        a check would start from, and `retry_after` is present when
        `allowed` is false. Errors are those of `/v1/check`.
      security:
        - {}
        - callerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CheckRequest"}
            example: {method: GET, path: /api/products}
      responses:
        "200":
          description: The allowance. Nothing was taken.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Decision"}
              examples:
                available:
                  value: {allowed: true, limit: 100, remaining: 40, reset_after: 36}
                empty:
                  value: {allowed: false, limit: 100, remaining: 0, reset_after: 60, retry_after: 1}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidAPIKey"
        "403":
          description: The caller's client is disabled, or no enabled policy applies to the caller.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413":
          description: The body is larger than 4 KiB.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/clients:
    post:
      tags: [clients]
      operationId: registerClient
      summary: Register a client application
      description: |
        Creates the client and issues its first API key in one call. The full
        key is in this response and nowhere else: RateGuard stores only its
        SHA-256 digest, so it cannot be shown again. A new client has no
        policy until one is assigned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterClientRequest"
      responses:
        "201":
          description: Registered. Store `api_key.key` now; it cannot be retrieved later.
          headers:
            Location:
              description: The new client's URL.
              schema: {type: string}
            Cache-Control:
              description: Always `no-store`, because the body carries a secret.
              schema: {type: string, const: no-store}
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterClientResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [clients]
      operationId: listClients
      summary: List client applications
      description: Clients in registration order, one page at a time.
      parameters:
        - name: limit
          in: query
          description: Page size.
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: after
          in: query
          description: The `next_after` value from the previous page.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: One page of clients.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/clients/{clientID}:
    parameters:
      - $ref: "#/components/parameters/ClientID"
    get:
      tags: [clients]
      operationId: getClient
      summary: Get a client application
      responses:
        "200":
          description: The client.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/clients/{clientID}/policy:
    parameters:
      - $ref: "#/components/parameters/ClientID"
    put:
      tags: [clients, policies]
      operationId: assignClientPolicy
      summary: Assign a policy to a client
      description: |
        Puts the client on a policy, or with `"policy_id": null` takes it off
        any policy so it falls back to the default. The field is required, so
        an empty body cannot remove a plan by accident. A disabled policy
        cannot be assigned. The change reaches every RateGuard instance within
        milliseconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignPolicyRequest"
      responses:
        "200":
          description: The client, with its new policy.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such client, or no such policy. The message says which.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/clients/{clientID}/keys:
    parameters:
      - $ref: "#/components/parameters/ClientID"
    get:
      tags: [clients]
      operationId: listClientKeys
      summary: List a client's API keys
      description: |
        Every key the client has held, revoked ones included, oldest first.
        Keys are described by their public prefix; the full value is never
        returned here.
      responses:
        "200":
          description: The client's keys.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [clients]
      operationId: issueClientKey
      summary: Issue another API key (rotate)
      description: |
        Rotation without downtime: issue a new key, move callers onto it,
        then revoke the old key with DELETE. Both keys work in between. A
        client may hold at most two active keys, so a third is refused
        with 409 until one is revoked. The full key is in this response
        only.
      responses:
        "201":
          description: Issued. Store `key` now; it cannot be retrieved later.
          headers:
            Cache-Control:
              description: Always `no-store`, because the body carries a secret.
              schema: {type: string, const: no-store}
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedAPIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/clients/{clientID}/keys/{keyID}:
    parameters:
      - $ref: "#/components/parameters/ClientID"
      - name: keyID
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [clients]
      operationId: revokeClientKey
      summary: Revoke an API key
      description: |
        Requests that present the key fail from now on. Revoking a key that
        is already revoked succeeds and keeps the original revocation time.
        A key that belongs to a different client is treated as not found.
      responses:
        "204":
          description: Revoked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/policies:
    post:
      tags: [policies]
      operationId: createPolicy
      summary: Create a policy
      description: |
        `refill_rate` defaults to `capacity / window_seconds`. Set it lower to
        allow bursts larger than the sustained rate. With `default: true` the
        new policy becomes the default, taking the flag from the previous one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePolicyRequest"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: The new policy's URL.
              schema: {type: string}
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [policies]
      operationId: listPolicies
      summary: List policies
      description: Policies in creation order, one page at a time, disabled ones included.
      parameters:
        - name: limit
          in: query
          description: Page size.
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: after
          in: query
          description: The `next_after` value from the previous page.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: One page of policies.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/policies/{policyID}:
    parameters:
      - $ref: "#/components/parameters/PolicyID"
    get:
      tags: [policies]
      operationId: getPolicy
      summary: Get a policy
      responses:
        "200":
          description: The policy.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [policies]
      operationId: updatePolicy
      summary: Update a policy
      description: |
        Changes only the fields given. Changing `capacity` or `window_seconds`
        without `refill_rate` recomputes the refill rate as
        `capacity / window_seconds`. `default: true` moves the default flag
        here; `default: false` clears it. `enabled: true` re-enables a
        disabled policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePolicyRequest"
      responses:
        "200":
          description: The updated policy.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [policies]
      operationId: disablePolicy
      summary: Disable a policy
      description: |
        Policies are disabled, never deleted, so no client is left pointing at
        a missing policy. Clients on a disabled policy fall back to the
        default policy. Disabling a disabled policy succeeds. Re-enable with
        `PATCH {"enabled": true}`.
      responses:
        "204":
          description: Disabled.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/policies/{policyID}/rules:
    parameters:
      - $ref: "#/components/parameters/PolicyID"
    get:
      tags: [policies]
      operationId: listEndpointRules
      summary: List a policy's endpoint rules
      description: The policy's rules in creation order. Precedence does not depend on this order.
      responses:
        "200":
          description: The policy's rules.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointRuleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [policies]
      operationId: createEndpointRule
      summary: Add an endpoint rule
      description: |
        Gives requests matching `method` and `path_pattern` their own limit
        within the policy, in place of the policy's own. Every path a rule
        matches shares one bucket per caller.

        **Patterns.** A pattern starts with `/`. A segment is a literal
        (matched exactly, case-sensitively), `*` (exactly one segment) or,
        as the last segment only, `**` (zero or more segments). Request paths
        are cleaned before matching, so `/api/login/` and `/api//login` both
        match `/api/login`.

        **Precedence.** When several rules match, the most specific wins:
        patterns are compared segment by segment from the left, and at the
        first difference a literal beats `*`, which beats `**`. Between
        equally specific patterns, a rule for the request's method beats one
        for `*`. See ADR 0010.

        A policy holds at most 100 rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEndpointRuleRequest"
      responses:
        "201":
          description: Created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/policies/{policyID}/rules/{ruleID}:
    parameters:
      - $ref: "#/components/parameters/PolicyID"
      - name: ruleID
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [policies]
      operationId: deleteEndpointRule
      summary: Delete an endpoint rule
      description: Requests it matched fall under the policy's own limit, or under the next most specific rule. A rule of another policy is treated as not found.
      responses:
        "204":
          description: Deleted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: The value of `RG_ADMIN_TOKEN` (ADR 0008).
    callerKey:
      type: http
      scheme: bearer
      description: |
        The API key of the caller a decision is about, forwarded by your
        application. It identifies the caller; it does not authorise the
        application to call RateGuard.
  parameters:
    ClientID:
      name: clientID
      in: path
      required: true
      schema: {type: string, format: uuid}
    PolicyID:
      name: policyID
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: name is required, request_id: 3f1c2a9e0b7d4c6e8a5f1b2c3d4e5f60}
    Unauthorized:
      description: The admin token is missing or wrong.
      headers:
        WWW-Authenticate:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: The request clashes with current state, such as a client that already has two active keys.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    PayloadTooLarge:
      description: The body is larger than 64 KiB.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    UnsupportedMediaType:
      description: The body is not `application/json`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InvalidAPIKey:
      description: |
        The forwarded API key is malformed, unknown or revoked. A request
        with a bad key is never decided by IP instead.
      headers:
        WWW-Authenticate:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: invalid API key, request_id: 3f1c2a9e0b7d4c6e8a5f1b2c3d4e5f60}
    InternalError:
      description: Something failed inside RateGuard. The details are in the service log under the request ID.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  headers:
    RateLimitLimit:
      description: The bucket's capacity; equal to `limit` (ADR 0016).
      schema: {type: integer, minimum: 1}
    RateLimitRemaining:
      description: Whole requests still available; equal to `remaining`.
      schema: {type: integer, minimum: 0}
    RateLimitReset:
      description: |
        Seconds until the bucket is full again, rounded up; equal to
        `reset_after`. A delta, not a timestamp, so no clock needs to agree
        with RateGuard's (ADR 0002).
      schema: {type: integer, minimum: 0}
    RequestID:
      description: The request ID, echoed from the request or generated.
      schema:
        type: string
        maxLength: 64
        pattern: "^[A-Za-z0-9._-]+$"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not ready]
        checks:
          type: object
          description: State of each dependency, keyed by name.
          additionalProperties:
            type: string
            enum: [ok, unavailable]
    Error:
      type: object
      description: The body of every error response.
      required: [error, request_id]
      properties:
        error:
          type: string
          description: A short, client-safe message. It never contains internals.
        request_id:
          type: string
          description: Quote this when reporting a problem; it matches the service log.
    CheckRequest:
      type: object
      description: The request your application received (ADR 0015).
      required: [method, path]
      additionalProperties: false
      properties:
        method:
          type: string
          description: Its HTTP method, in any case.
          minLength: 1
          maxLength: 32
          pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
        path:
          type: string
          description: |
            Its path, without the query string or fragment, which are refused
            so that `/api/login?x` cannot escape a rule on `/api/login`.
          minLength: 1
          maxLength: 2048
          pattern: "^/[^?#\\x00-\\x1f\\x7f]*$"
    Decision:
      type: object
      required: [allowed, limit, remaining, reset_after]
      properties:
        allowed:
          type: boolean
        limit:
          type: integer
          description: The bucket's capacity under the policy or endpoint rule that applied.
          minimum: 1
        remaining:
          type: integer
          description: Whole requests still available.
          minimum: 0
        reset_after:
          type: integer
          description: Seconds until the bucket is full again, rounded up; 0 if it is full.
          minimum: 0
        retry_after:
          type: integer
          description: Sent only when refused. Seconds until a request would be allowed, rounded up.
          minimum: 1
    RegisterClientRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Surrounding whitespace is trimmed. Its first three letters or digits become the key tag (`rg_cus_` for "Customer App").
          minLength: 1
          maxLength: 100
          example: Customer App
    Client:
      type: object
      required: [id, name, policy_id, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        policy_id:
          type: [string, "null"]
          format: uuid
          description: The assigned policy, or null until one is assigned.
        status: {type: string, enum: [active, disabled]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ClientList:
      type: object
      required: [clients]
      properties:
        clients:
          type: array
          items: {$ref: "#/components/schemas/Client"}
        next_after:
          type: string
          format: uuid
          description: Present when the page is full. Pass it as `after` for the next page.
    APIKey:
      type: object
      description: A key, described by its public prefix. The key itself is never returned again after creation.
      required: [id, client_id, prefix, active, created_at, revoked_at]
      properties:
        id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        prefix:
          type: string
          description: The public part of the key, safe to log.
          pattern: "^rg_[a-z0-9]{1,3}_[a-z2-7]{16}$"
          example: rg_cus_7hq2mfx4kd5ta3wb
        active: {type: boolean}
        created_at: {type: string, format: date-time}
        revoked_at:
          type: [string, "null"]
          format: date-time
    IssuedAPIKey:
      description: A newly issued key, with its full value. This is the only time the value is returned.
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: "The full key. Send it as `Authorization: Bearer <key>`."
              pattern: "^rg_[a-z0-9]{1,3}_[a-z2-7]{16}_[a-z2-7]{52}$"
    APIKeyList:
      type: object
      required: [api_keys]
      properties:
        api_keys:
          type: array
          items: {$ref: "#/components/schemas/APIKey"}
    RegisterClientResponse:
      type: object
      required: [client, api_key]
      properties:
        client: {$ref: "#/components/schemas/Client"}
        api_key: {$ref: "#/components/schemas/IssuedAPIKey"}
    Policy:
      type: object
      required: [id, name, capacity, window_seconds, refill_rate, enabled, default, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, example: Free}
        capacity:
          type: integer
          description: Bucket size, the largest burst. With `window_seconds`, the advertised limit ("100 per 60 seconds").
          example: 100
        window_seconds: {type: integer, example: 60}
        refill_rate:
          type: number
          description: Tokens returned to the bucket per second.
          example: 1.6666666666666667
        enabled:
          type: boolean
          description: A disabled policy applies to nobody; its clients fall back to the default.
        default:
          type: boolean
          description: Whether this is the default policy. At most one policy is.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PolicyList:
      type: object
      required: [policies]
      properties:
        policies:
          type: array
          items: {$ref: "#/components/schemas/Policy"}
        next_after:
          type: string
          format: uuid
          description: Present when the page is full. Pass it as `after` for the next page.
    CreatePolicyRequest:
      type: object
      required: [name, capacity, window_seconds]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Unique. Surrounding whitespace is trimmed.
          minLength: 1
          maxLength: 100
          example: Free
        capacity: {type: integer, minimum: 1, maximum: 1000000000, example: 100}
        window_seconds: {type: integer, minimum: 1, maximum: 86400, example: 60}
        refill_rate:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000000
          description: Defaults to `capacity / window_seconds`.
        enabled: {type: boolean, default: true}
        default: {type: boolean, default: false}
    UpdatePolicyRequest:
      type: object
      description: At least one field must be set.
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        capacity: {type: integer, minimum: 1, maximum: 1000000000}
        window_seconds: {type: integer, minimum: 1, maximum: 86400}
        refill_rate: {type: number, exclusiveMinimum: 0, maximum: 1000000000}
        enabled: {type: boolean}
        default: {type: boolean}
    AssignPolicyRequest:
      type: object
      required: [policy_id]
      additionalProperties: false
      properties:
        policy_id:
          type: [string, "null"]
          format: uuid
          description: The policy to assign, or null to remove the client's policy.
    EndpointRule:
      type: object
      required: [id, policy_id, method, path_pattern, capacity, window_seconds, created_at]
      properties:
        id: {type: string, format: uuid}
        policy_id: {type: string, format: uuid}
        method:
          type: string
          description: An upper-case HTTP method, or `*` for any.
          example: POST
        path_pattern: {type: string, example: /api/login}
        capacity: {type: integer, example: 5}
        window_seconds:
          type: integer
          description: The rule refills at `capacity / window_seconds` tokens a second.
          example: 60
        created_at: {type: string, format: date-time}
    EndpointRuleList:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items: {$ref: "#/components/schemas/EndpointRule"}
    CreateEndpointRuleRequest:
      type: object
      required: [method, path_pattern, capacity, window_seconds]
      additionalProperties: false
      properties:
        method:
          type: string
          description: An HTTP method (any case; stored upper-case), or `*` for any.
          maxLength: 16
          example: POST
        path_pattern:
          type: string
          description: See the pattern syntax above. At most 512 bytes.
          maxLength: 512
          example: /api/login
        capacity: {type: integer, minimum: 1, maximum: 1000000000, example: 5}
        window_seconds: {type: integer, minimum: 1, maximum: 86400, example: 60}
