openapi: 3.1.0
info:
  title: RateGuard
  version: 0.1.0
  summary: Distributed API rate limiting as a service.
  description: |
    RateGuard decides whether a request to your application should be allowed,
    against a token bucket shared by every RateGuard instance through Redis.

    Every response carries an `X-Request-ID` header. An inbound `X-Request-ID`
    of at most 64 characters from `[A-Za-z0-9._-]` is reused; anything else is
    replaced with a generated ID.

    Admin routes (`/v1/clients`) require `Authorization: Bearer <RG_ADMIN_TOKEN>`.
    Every error has the same body: `{"error": "...", "request_id": "..."}`.
servers:
  - url: http://127.0.0.1:8080
    description: Local Docker Compose stack
security:
  - adminToken: []
tags:
  - name: health
    description: Liveness and readiness probes.
  - name: clients
    description: Register client applications and manage their API keys.
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Liveness probe
      description: Reports that the process is up. It checks no dependencies.
      security: [] # Probes are unauthenticated by design.
      responses:
        "200":
          description: The process is serving.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: Readiness probe
      description: |
        Checks that PostgreSQL and Redis answer within `RG_READINESS_TIMEOUT`.
        The checks run concurrently. Failure details go to the service log,
        never into the response.
      security: [] # Probes are unauthenticated by design.
      responses:
        "200":
          description: Every dependency is reachable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ready
                checks: {postgres: ok, redis: ok}
        "503":
          description: At least one dependency is unreachable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: not ready
                checks: {postgres: unavailable, redis: ok}
  /v1/clients:
    post:
      tags: [clients]
      operationId: registerClient
      summary: Register a client application
      description: |
        Creates the client and issues its first API key in one call. The full
        key is in this response and nowhere else: RateGuard stores only its
        SHA-256 digest, so it cannot be shown again. A new client has no
        policy until one is assigned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterClientRequest"
      responses:
        "201":
          description: Registered. Store `api_key.key` now; it cannot be retrieved later.
          headers:
            Location:
              description: The new client's URL.
              schema: {type: string}
            Cache-Control:
              description: Always `no-store`, because the body carries a secret.
              schema: {type: string, const: no-store}
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterClientResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [clients]
      operationId: listClients
      summary: List client applications
      description: Clients in registration order, one page at a time.
      parameters:
        - name: limit
          in: query
          description: Page size.
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: after
          in: query
          description: The `next_after` value from the previous page.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: One page of clients.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/clients/{clientID}:
    parameters:
      - $ref: "#/components/parameters/ClientID"
    get:
      tags: [clients]
      operationId: getClient
      summary: Get a client application
      responses:
        "200":
          description: The client.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/clients/{clientID}/keys:
    parameters:
      - $ref: "#/components/parameters/ClientID"
    get:
      tags: [clients]
      operationId: listClientKeys
      summary: List a client's API keys
      description: |
        Every key the client has held, revoked ones included, oldest first.
        Keys are described by their public prefix; the full value is never
        returned here.
      responses:
        "200":
          description: The client's keys.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [clients]
      operationId: issueClientKey
      summary: Issue another API key (rotate)
      description: |
        Rotation without downtime: issue a new key, move callers onto it,
        then revoke the old key with DELETE. Both keys work in between. A
        client may hold at most two active keys, so a third is refused
        with 409 until one is revoked. The full key is in this response
        only.
      responses:
        "201":
          description: Issued. Store `key` now; it cannot be retrieved later.
          headers:
            Cache-Control:
              description: Always `no-store`, because the body carries a secret.
              schema: {type: string, const: no-store}
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedAPIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/clients/{clientID}/keys/{keyID}:
    parameters:
      - $ref: "#/components/parameters/ClientID"
      - name: keyID
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [clients]
      operationId: revokeClientKey
      summary: Revoke an API key
      description: |
        Requests that present the key fail from now on. Revoking a key that
        is already revoked succeeds and keeps the original revocation time.
        A key that belongs to a different client is treated as not found.
      responses:
        "204":
          description: Revoked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: The value of `RG_ADMIN_TOKEN` (ADR 0008).
  parameters:
    ClientID:
      name: clientID
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: name is required, request_id: 3f1c2a9e0b7d4c6e8a5f1b2c3d4e5f60}
    Unauthorized:
      description: The admin token is missing or wrong.
      headers:
        WWW-Authenticate:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: The request clashes with current state, such as a client that already has two active keys.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    PayloadTooLarge:
      description: The body is larger than 64 KiB.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    UnsupportedMediaType:
      description: The body is not `application/json`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InternalError:
      description: Something failed inside RateGuard. The details are in the service log under the request ID.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  headers:
    RequestID:
      description: The request ID, echoed from the request or generated.
      schema:
        type: string
        maxLength: 64
        pattern: "^[A-Za-z0-9._-]+$"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not ready]
        checks:
          type: object
          description: State of each dependency, keyed by name.
          additionalProperties:
            type: string
            enum: [ok, unavailable]
    Error:
      type: object
      description: The body of every error response.
      required: [error, request_id]
      properties:
        error:
          type: string
          description: A short, client-safe message. It never contains internals.
        request_id:
          type: string
          description: Quote this when reporting a problem; it matches the service log.
    RegisterClientRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Surrounding whitespace is trimmed. Its first three letters or digits become the key tag (`rg_cus_` for "Customer App").
          minLength: 1
          maxLength: 100
          example: Customer App
    Client:
      type: object
      required: [id, name, policy_id, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        policy_id:
          type: [string, "null"]
          format: uuid
          description: The assigned policy, or null until one is assigned.
        status: {type: string, enum: [active, disabled]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ClientList:
      type: object
      required: [clients]
      properties:
        clients:
          type: array
          items: {$ref: "#/components/schemas/Client"}
        next_after:
          type: string
          format: uuid
          description: Present when the page is full. Pass it as `after` for the next page.
    APIKey:
      type: object
      description: A key, described by its public prefix. The key itself is never returned again after creation.
      required: [id, client_id, prefix, active, created_at, revoked_at]
      properties:
        id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        prefix:
          type: string
          description: The public part of the key, safe to log.
          pattern: "^rg_[a-z0-9]{1,3}_[a-z2-7]{16}$"
          example: rg_cus_7hq2mfx4kd5ta3wb
        active: {type: boolean}
        created_at: {type: string, format: date-time}
        revoked_at:
          type: [string, "null"]
          format: date-time
    IssuedAPIKey:
      description: A newly issued key, with its full value. This is the only time the value is returned.
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: "The full key. Send it as `Authorization: Bearer <key>`."
              pattern: "^rg_[a-z0-9]{1,3}_[a-z2-7]{16}_[a-z2-7]{52}$"
    APIKeyList:
      type: object
      required: [api_keys]
      properties:
        api_keys:
          type: array
          items: {$ref: "#/components/schemas/APIKey"}
    RegisterClientResponse:
      type: object
      required: [client, api_key]
      properties:
        client: {$ref: "#/components/schemas/Client"}
        api_key: {$ref: "#/components/schemas/IssuedAPIKey"}
