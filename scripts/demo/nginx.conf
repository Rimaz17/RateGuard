# Round-robin over every RateGuard replica. Docker's DNS returns one address
# per replica, and nginx adds each as an upstream server when it starts.
upstream rateguard {
    server rateguard:8080;
    keepalive 32;
}

server {
    listen 80;

    location / {
        proxy_pass http://rateguard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Which instance answered, so the demo can show the spread.
        add_header X-Upstream $upstream_addr always;
    }
}
