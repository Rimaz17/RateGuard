# Local development stack: RateGuard, PostgreSQL and Redis.
# Values come from .env (copied from configs/.env.example by `make up`); nothing secret
# lives in this file. Dependency ports bind to 127.0.0.1 only.
name: rateguard

services:
  rateguard:
    build: .
    image: rateguard:dev
    ports:
      - "127.0.0.1:${RATEGUARD_HOST_PORT:-8080}:8080"
    environment:
      # Fixed inside the container; publish a different host port with
      # RATEGUARD_HOST_PORT instead.
      RG_HTTP_ADDR: ":8080"
      RG_HTTP_READ_HEADER_TIMEOUT: ${RG_HTTP_READ_HEADER_TIMEOUT:-}
      RG_HTTP_READ_TIMEOUT: ${RG_HTTP_READ_TIMEOUT:-}
      RG_HTTP_WRITE_TIMEOUT: ${RG_HTTP_WRITE_TIMEOUT:-}
      RG_HTTP_IDLE_TIMEOUT: ${RG_HTTP_IDLE_TIMEOUT:-}
      RG_SHUTDOWN_TIMEOUT: ${RG_SHUTDOWN_TIMEOUT:-}
      RG_LOG_LEVEL: ${RG_LOG_LEVEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (see configs/.env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see configs/.env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env (see configs/.env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine
    # Bucket state is ephemeral by design; skip RDB snapshots in development.
    command: ["redis-server", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  pgdata:
