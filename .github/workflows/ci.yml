name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0 # keep in step with the Makefile

jobs:
  lint:
    name: format, vet, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...
      - name: go test (race)
        run: go test -race -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: token bucket engine coverage is at least 90%
        run: make cover-engine

  integration:
    name: integration tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Real Postgres and Redis containers, with -race. Includes the
      # migrations up/down/up check against a fresh database.
      - name: go test -race -tags integration
        run: make test-integration

  example:
    name: reference middleware module (examples/go-middleware)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/go-middleware
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/go-middleware/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: examples/go-middleware
      - name: go build
        run: go build ./...
      # TestE2E skips here; the container job runs it against the stack.
      - name: go test (race)
        run: go test -race ./...

  container:
    name: image and compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/go-middleware/go.mod
      - name: go version matches Dockerfile
        run: make check-go-version
      - name: docker build
        run: make docker-build
      - name: make up
        run: make up
      - name: /healthz and /readyz return 200
        run: make smoke
      - name: admin api rejects a missing token and registers a client
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"name":"CI smoke"}' http://127.0.0.1:8080/v1/clients)"
          echo "POST /v1/clients without a token: $code"
          test "$code" = 401
          token="$(sed -n 's/^RG_ADMIN_TOKEN=//p' .env)"
          curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"name":"CI smoke"}' http://127.0.0.1:8080/v1/clients | grep -q '"key":"rg_cis_'
      - name: policy api creates a plan with a rule and assigns it, and the instance is subscribed
        run: |
          base=http://127.0.0.1:8080
          token="$(sed -n 's/^RG_ADMIN_TOKEN=//p' .env)"
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"name":"CI Free","capacity":100,"window_seconds":60}' "$base/v1/policies")"
          echo "POST /v1/policies without a token: $code"
          test "$code" = 401
          policy="$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"name":"CI Free","capacity":100,"window_seconds":60,"default":true}' "$base/v1/policies")"
          echo "$policy"
          policy_id="$(echo "$policy" | sed -n 's/^{"id":"\([^"]*\)".*/\1/p')"
          test -n "$policy_id"
          curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"method":"post","path_pattern":"/api/login","capacity":5,"window_seconds":60}' "$base/v1/policies/$policy_id/rules" | grep -q '"method":"POST"'
          client_id="$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"name":"CI plan"}' "$base/v1/clients" | sed -n 's/^{"client":{"id":"\([^"]*\)".*/\1/p')"
          test -n "$client_id"
          curl -fsS -X PUT -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "{\"policy_id\":\"$policy_id\"}" "$base/v1/clients/$client_id/policy" | grep -q "\"policy_id\":\"$policy_id\""
          subscribers="$(docker compose exec -T redis redis-cli PUBSUB NUMSUB rg:policy:invalidate | tail -n 1)"
          echo "subscribers on rg:policy:invalidate: $subscribers"
          test "$subscribers" = 1
      - name: decision endpoint decides, refuses query strings, and metrics are served
        run: |
          base=http://127.0.0.1:8080
          token="$(sed -n 's/^RG_ADMIN_TOKEN=//p' .env)"
          key="$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"name":"CI decide"}' "$base/v1/clients" | sed -n 's/.*"key":"\([^"]*\)".*/\1/p')"
          test -n "$key"
          decision="$(curl -fsS -H "Authorization: Bearer $key" -H 'Content-Type: application/json' -d '{"method":"GET","path":"/api/products"}' "$base/v1/check")"
          echo "$decision"
          echo "$decision" | grep -q '"allowed":true,"limit":100,"remaining":99'
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $key" -H 'Content-Type: application/json' -d '{"method":"GET","path":"/api/login?x=1"}' "$base/v1/check")"
          echo "path with a query string: $code"
          test "$code" = 400
          # Redis made the decision: nothing was degraded and the breaker is closed.
          metrics="$(curl -fsS "$base/metrics")"
          echo "$metrics" | grep -qx 'rateguard_degraded_decisions_total{mode="local"} 0'
          echo "$metrics" | grep -qx 'rateguard_redis_breaker_state 0'
      - name: rate-limit headers, peek, openapi document and json routing misses
        run: |
          base=http://127.0.0.1:8080
          token="$(sed -n 's/^RG_ADMIN_TOKEN=//p' .env)"
          key="$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"name":"CI headers"}' "$base/v1/clients" | sed -n 's/.*"key":"\([^"]*\)".*/\1/p')"
          headers="$(curl -fsS -D - -o /dev/null -H "Authorization: Bearer $key" -H 'Content-Type: application/json' -d '{"method":"GET","path":"/"}' "$base/v1/check" | tr -d '\r')"
          echo "$headers"
          echo "$headers" | grep -qx 'X-Ratelimit-Limit: 100'
          echo "$headers" | grep -qx 'X-Ratelimit-Remaining: 99'
          echo "$headers" | grep -qx 'X-Ratelimit-Reset: 1'
          curl -fsS -H "Authorization: Bearer $key" -H 'Content-Type: application/json' -d '{"method":"GET","path":"/"}' "$base/v1/peek" | grep -q '"allowed":true,"limit":100'
          curl -fsS "$base/openapi.yaml" | head -1 | grep -q '^openapi: 3.1'
          curl -s "$base/no-such-route" | grep -q '"request_id"'
      - name: reference middleware against the stack (examples/go-middleware TestE2E)
        run: |
          base=http://127.0.0.1:8080
          token="$(sed -n 's/^RG_ADMIN_TOKEN=//p' .env)"
          policy_id="$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"name":"CI E2E","capacity":3,"window_seconds":3600}' "$base/v1/policies" | sed -n 's/^{"id":"\([^"]*\)".*/\1/p')"
          reg="$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"name":"CI E2E"}' "$base/v1/clients")"
          client_id="$(echo "$reg" | sed -n 's/^{"client":{"id":"\([^"]*\)".*/\1/p')"
          key="$(echo "$reg" | sed -n 's/.*"key":"\([^"]*\)".*/\1/p')"
          curl -fsS -o /dev/null -X PUT -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "{\"policy_id\":\"$policy_id\"}" "$base/v1/clients/$client_id/policy"
          cd examples/go-middleware
          RATEGUARD_URL="$base" RATEGUARD_API_KEY="$key" RATEGUARD_LIMIT=3 go test -race -count=1 -run TestE2E -v ./ | tee e2e.log
          grep -q -- '--- PASS: TestE2E' e2e.log
      - name: usage analytics reach postgres through redis, and the phase 7 metrics are served
        run: |
          set -eu
          base=http://127.0.0.1:8080
          token="$(sed -n 's/^RG_ADMIN_TOKEN=//p' .env)"
          reg="$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"name":"CI usage"}' "$base/v1/clients")"
          client_id="$(echo "$reg" | sed -n 's/^{"client":{"id":"\([^"]*\)".*/\1/p')"
          key="$(echo "$reg" | sed -n 's/.*"key":"\([^"]*\)".*/\1/p')"
          for _ in 1 2 3; do
            curl -fsS -o /dev/null -H "Authorization: Bearer $key" -H 'Content-Type: application/json' -d '{"method":"GET","path":"/"}' "$base/v1/check"
          done
          code="$(curl -s -o /dev/null -w '%{http_code}' "$base/v1/analytics/usage")"
          echo "GET /v1/analytics/usage without a token: $code"
          test "$code" = 401
          # Flushed within a second, rolled up within ten.
          for _ in $(seq 1 30); do
            usage="$(curl -fsS -H "Authorization: Bearer $token" "$base/v1/analytics/usage?granularity=minute&top=100")"
            if echo "$usage" | grep -q "\"client_id\":\"$client_id\",\"name\":\"CI usage\",\"requests\":3,\"allowed\":3,\"rejected\":0"; then
              echo "$usage" | head -c 400; echo
              break
            fi
            sleep 1
          done
          echo "$usage" | grep -q "\"client_id\":\"$client_id\",\"name\":\"CI usage\",\"requests\":3"
          metrics="$(curl -fsS "$base/metrics")"
          echo "$metrics" | grep -q '^rateguard_decisions_total{outcome="allowed"} '
          echo "$metrics" | grep -q '^rateguard_decision_duration_seconds_count{operation="check"} '
          echo "$metrics" | grep -q '^rateguard_cache_lookups_total{cache="api_key",result="hit"} '
          echo "$metrics" | grep -qx 'rateguard_usage_dropped_total 0'
      - name: k6 load scripts run against the stack (smoke, not a measurement)
        run: |
          set -eu
          token="$(sed -n 's/^RG_ADMIN_TOKEN=//p' .env)"
          for script in latency.js throughput.js; do
            docker run --rm --network rateguard_default -v "$PWD/test/load:/scripts:ro" \
              -e BASE_URL=http://rateguard:8080 -e ADMIN_TOKEN="$token" \
              -e RATE=20 -e DURATION=3s -e WARMUP=1s -e CLIENTS=2 -e VUS=2 \
              grafana/k6:1.4.2 run --quiet --no-color "/scripts/$script" | tee k6.log
            grep -q 'status 200      100.00%' k6.log
          done
      - name: migrate down one step and back up through the binary
        run: make migrate-down && make migrate-up
      - name: readiness flips when postgres stops, and recovers
        run: |
          docker compose stop postgres
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/readyz)"
          echo "/readyz with postgres stopped: $code"
          test "$code" = 503
          docker compose start postgres
          make smoke
      - name: compose logs
        if: failure()
        run: docker compose logs
      - name: make down
        if: always()
        run: make down

  demo:
    name: distributed demo (three instances, redis stopped and restarted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Fails unless exactly 100 of 300 requests get through three instances,
      # every request is still decided with Redis stopped, and the breakers
      # close once it is back.
      - name: make demo
        run: make demo
      - name: compose logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml logs
      - name: make demo-down
        if: always()
        run: make demo-down
