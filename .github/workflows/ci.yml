name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0 # keep in step with the Makefile

jobs:
  lint:
    name: format, vet, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...
      - name: go test (race)
        run: go test -race -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  integration:
    name: integration tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Real Postgres and Redis containers, with -race. Includes the
      # migrations up/down/up check against a fresh database.
      - name: go test -race -tags integration
        run: make test-integration

  container:
    name: image and compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: go version matches Dockerfile
        run: make check-go-version
      - name: docker build
        run: make docker-build
      - name: make up
        run: make up
      - name: /healthz and /readyz return 200
        run: make smoke
      - name: admin api rejects a missing token and registers a client
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"name":"CI smoke"}' http://127.0.0.1:8080/v1/clients)"
          echo "POST /v1/clients without a token: $code"
          test "$code" = 401
          token="$(sed -n 's/^RG_ADMIN_TOKEN=//p' .env)"
          curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"name":"CI smoke"}' http://127.0.0.1:8080/v1/clients | grep -q '"key":"rg_cis_'
      - name: migrate down one step and back up through the binary
        run: make migrate-down && make migrate-up
      - name: readiness flips when postgres stops, and recovers
        run: |
          docker compose stop postgres
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/readyz)"
          echo "/readyz with postgres stopped: $code"
          test "$code" = 503
          docker compose start postgres
          make smoke
      - name: compose logs
        if: failure()
        run: docker compose logs
      - name: make down
        if: always()
        run: make down
